# Push a tag `v<VERSION>` to build the macOS .dmg and attach it to a draft GitHub
# release. Unsigned until the signing secrets exist: scripts/package.mjs decides
# signing from the environment alone, so adding CSC_LINK, CSC_KEY_PASSWORD,
# APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID as repository secrets is
# the whole switch.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# One tag push has been seen to start two runs a second apart. They raced to create the draft
# and one failed uploading to a draft the other had made. Queue them instead: the second finds
# the first's draft and re-uploads the same files over it.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mac:
    name: Package (macOS)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(cat VERSION)" = "${GITHUB_REF_NAME}"

      - run: npm ci

      - run: npm run build:packages

      - name: Package
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # A release without the microphone fails here rather than shipping quietly without it.
          ELASTIC_REQUIRE_DICTATION: "1"
        run: npm run package:mac -- --arm64 --x64

      - name: Draft release with the installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(cat VERSION)"
          # A draft is not attached to its tag until published (`gh release view <tag>` misses it),
          # so it is looked up by the tag name it carries.
          existing=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq "[.[] | select(.tag_name == \"$tag\")][0].id // empty")
          [ -n "$existing" ] || gh release create "$tag" --draft --title "elastic $tag" --notes "elastic $tag"
          # latest-mac.yml is the update feed electron-updater reads; without it a
          # published release is invisible to installed apps.
          gh release upload "$tag" release/*.dmg release/*.zip release/*.blockmap release/latest-mac.yml --clobber
