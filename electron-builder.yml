appId: dev.elastic.desktop
# Keep in step with src/shared/brand.ts and package.json productName.
productName: elastic
copyright: Copyright © elastic contributors

# `npm run build` (electron-vite) has to have run first: everything shipped
# comes out of out/, plus the native modules electron-builder resolves from
# `dependencies` in package.json. `scripts/package.mjs` does both in order and
# is the only supported way in — it stamps the version and decides, from the
# environment alone, whether this build is signed.
directories:
  buildResources: build
  output: release

files:
  - out/**/*
  - package.json
  - "!**/*.map"

# What ships beside the app rather than inside the asar.
extraResources:
  - from: src/main/browser/vendor/LICENSE
    to: notices/browser-use-browser-harness-js-LICENSE
  # The bundled plugins: elastic's own tools and skills (browser, documents,
  # PDF, terminals), installed on start (src/main/integrations/index.ts,
  # bundledMarketplace).
  - from: resources/bundled
    to: bundled
  # The example plugins' marketplace, listed on the Plugins page
  # (src/main/integrations/index.ts, builtinMarketplace).
  - from: resources/plugins
    to: plugins

# One icon source, build/icon.png (scripts/make-icons.mjs renders it; committed). electron-builder derives the macOS .icns and Windows .ico from it.

# No updater feed is configured: an unconfigured build never checks for
# updates (src/main/updater.ts). To ship updates, add a `publish` block here
# (for example `provider: github`, `owner`, `repo`) and the release workflow
# that attaches installers to it.

# better-sqlite3 and node-pty are native. `npm run native:rebuild` runs
# `electron-builder install-app-deps`, which rebuilds them against the Electron
# version above; asarUnpack keeps their .node files outside the archive so
# dlopen can find them at run time.
asar: true
asarUnpack:
  - "**/*.node"
  - node_modules/better-sqlite3/**
  - node_modules/node-pty/**
  # The app's MCP server is run by the AGENT (Codex, Claude Code) as a
  # script path in `session/new`, so it has to be a real file on disk, not an
  # entry in the archive (src/main/integrations/index.ts, mcpServerScript).
  - out/app-mcp/**

# Every artifact is named the same way, so a GitHub Release reads as a table:
# elastic-<version>-<os>-<arch>.<ext>.
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  darkModeSupport: true
  # Signing and notarisation are driven by the environment and nothing else
  # (scripts/package.mjs):
  #   CSC_LINK + CSC_KEY_PASSWORD            -> the build is signed
  #   APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD
  #     + APPLE_TEAM_ID                      -> and notarised (--config.mac.notarize=true)
  #   neither                                -> CSC_IDENTITY_AUTO_DISCOVERY=false
  #
  # `hardenedRuntime` and the entitlements are configuration, not something an
  # unsigned build exercises: codesign is what applies them, so only a signed
  # build ever tests them, and a signed rehearsal (`CSC_LINK` on a laptop) is a
  # manual step. Both plists carry every key electron-builder's own template
  # does. `notarize` is false here
  # and turned on by the packaging script, because a notarize attempt without
  # credentials fails the whole run.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  notarize: false
  extendInfo:
    NSHumanReadableCopyright: elastic contributors

dmg:
  # ${arch} in a dmg name is the architecture of the app inside it, which is
  # what someone downloading needs to tell the two apart.
  artifactName: ${productName}-${version}-${os}-${arch}.${ext}

win:
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # The installer, not the app: `-setup` keeps it apart from the zip in a
  # release's file list.
  artifactName: ${productName}-${version}-${os}-${arch}-setup.${ext}

linux:
  category: Development
  maintainer: elastic contributors <noreply@github.com>
  synopsis: A small desktop agent workbench built on MCP plugins
  # Best-effort and unsigned (plan §14). AppImage is the portable one; deb is a
  # convenience for the distributions that want it.
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
